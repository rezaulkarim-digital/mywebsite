<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REZAUL KARIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', Arial, sans-serif;
      background: url('sahed.jpg') center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .content {
      max-width: 650px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 54px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
    }
    h2 {
      margin: 0 0 25px;
      font-size: 22px;
      font-weight: 600;
      color: #7dd3fc;
    }
    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: #e2e8f0;
    }
    .photo-card {
      width: 100%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 12px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .photo-card img {
      display: block;
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>REZAUL KARIM</h1>
    <h2>Digital Marketing Learner</h2>
    <p>I am learning digital marketing and I want to work as a freelancer.</p>
    <div class="photo-card">
      <img src="photo2.jpeg" alt="REZAUL KARIM">
    </div>
  </div>
</body>
</html>
