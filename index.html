<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REZAUL KARIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --name-color: #ffffff;
      --tagline-color: #7dd3fc;
      --text-color: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', Arial, sans-serif;
      background: url('sahed.jpg') center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 70px;
    }
    .content { max-width: 900px; width: 100%; }
    h1 {
      margin: 0 0 10px;
      font-size: 54px;
      font-weight: 700;
      color: var(--name-color);
      letter-spacing: 2px;
    }
    h2 {
      margin: 0 0 25px;
      font-size: 22px;
      font-weight: 600;
      color: var(--tagline-color);
    }
    p {
      margin: 0 auto;
      max-width: 650px;
      font-size: 18px;
      line-height: 1.7;
      color: var(--text-color);
    }
    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
    }
    .contact a {
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 9px 18px;
      border-radius: 999px;
    }
    .contact a:hover { background: rgba(255, 255, 255, 0.3); }
    .photo-card {
      width: 100%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 12px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .photo-card img {
      display: block;
      width: 100%;
      border-radius: 12px;
    }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .video-card {
      background: #ffffff;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      color: #222;
    }
    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-card .vtitle { margin-top: 10px; font-size: 15px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 40px;
      align-items: start;
    }
    .gallery .photo-card { margin: 0; max-width: none; }
    .gallery figure { margin: 0; }
    .gallery figcaption { margin-top: 10px; font-size: 15px; color: #222; }
    .social { margin-top: 12px; text-align: left; color: #222; font-size: 14px; }
    .social-bar { display: flex; gap: 10px; }
    .social button {
      font-family: inherit;
      font-size: 14px;
      border: 1px solid #d5dbe3;
      background: #f5f7fa;
      color: #222;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .social button.liked { background: #ffe3e8; border-color: #ff9bb0; }
    .social button:disabled { opacity: 0.6; cursor: default; }
    .comments-box { display: none; margin-top: 12px; }
    .comments-box.open { display: block; }
    .comment-list { max-height: 220px; overflow-y: auto; }
    .comment {
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #f0f4f8;
      border-radius: 10px;
      word-wrap: break-word;
    }
    .comment b { display: block; font-size: 13px; }
    .comment-form input, .comment-form textarea {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      margin-top: 6px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
    }
    .comment-form button { margin-top: 8px; }
    .admin-link {
      position: fixed;
      left: 14px;
      bottom: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
    }
    .admin-link:hover { color: rgba(255, 255, 255, 0.9); }
  </style>
</head>
<body>
  <div class="content">
    <h1 id="name">REZAUL KARIM</h1>
    <h2 id="tagline">Digital Marketing Learner</h2>
    <p id="intro">I am learning digital marketing and I want to work as a freelancer.</p>
    <div class="contact" id="contact"></div>
    <div class="photo-card">
      <img id="mainPhoto" src="photo2.jpeg" alt="REZAUL KARIM">
    </div>
    <div class="videos" id="videos"></div>
    <div class="gallery" id="gallery"></div>
  </div>

  <a class="admin-link" href="/admin/">Admin</a>

  <script src="firebase-config.js"></script>
  <script type="module">
    // ---- Helpers ----
    function isColor(v) { return /^#[0-9a-fA-F]{3,8}$/.test(v || ''); }
    function isHttps(v) { return /^https:\/\//i.test(v || ''); }

    var FONTS = ['Poppins', 'Roboto', 'Lato', 'Montserrat', 'Playfair Display', 'Oswald'];

    function youtubeId(url) {
      var m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function addLink(box, text, href) {
      var a = document.createElement('a');
      a.textContent = text;
      a.href = href;
      if (/^https:/i.test(href)) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
      box.appendChild(a);
    }

    // ---- Site settings (name, look, contact, videos) ----
    fetch('data/site.json?v=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.name) {
          document.getElementById('name').textContent = s.name;
          document.title = s.name;
        }
        if (s.tagline) document.getElementById('tagline').textContent = s.tagline;
        if (s.intro) document.getElementById('intro').textContent = s.intro;
        if (s.main_photo) document.getElementById('mainPhoto').src = s.main_photo;

        if (s.background) {
          document.body.style.backgroundImage = 'url("' + String(s.background).replace(/"/g, '%22') + '")';
          document.body.style.backgroundPosition = 'center';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundRepeat = 'no-repeat';
          document.body.style.backgroundAttachment = 'fixed';
        }
        var root = document.documentElement.style;
        if (isColor(s.name_color)) root.setProperty('--name-color', s.name_color);
        if (isColor(s.tagline_color)) root.setProperty('--tagline-color', s.tagline_color);
        if (isColor(s.text_color)) root.setProperty('--text-color', s.text_color);

        if (s.font && FONTS.indexOf(s.font) !== -1) {
          document.getElementById('fontLink').href =
            'https://fonts.googleapis.com/css2?family=' + s.font.replace(/ /g, '+') + ':wght@400;600;700&display=swap';
          document.body.style.fontFamily = "'" + s.font + "', Arial, sans-serif";
        }

        // Contact buttons
        var contact = document.getElementById('contact');
        var wa = String(s.whatsapp || '').replace(/\D/g, '');
        if (wa) addLink(contact, 'WhatsApp', 'https://wa.me/' + wa);
        if (s.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email)) addLink(contact, 'Email', 'mailto:' + s.email);
        if (isHttps(s.facebook)) addLink(contact, 'Facebook', s.facebook);

        // Videos (YouTube)
        var vbox = document.getElementById('videos');
        (s.videos || []).forEach(function (v) {
          var id = youtubeId(v.url);
          if (!id) return;
          var card = document.createElement('div');
          card.className = 'video-card';
          var frame = document.createElement('div');
          frame.className = 'video-frame';
          var iframe = document.createElement('iframe');
          iframe.src = 'https://www.youtube.com/embed/' + id;
          iframe.title = v.title || 'Video';
          iframe.loading = 'lazy';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          frame.appendChild(iframe);
          card.appendChild(frame);
          if (v.title) {
            var t = document.createElement('div');
            t.className = 'vtitle';
            t.textContent = v.title;
            card.appendChild(t);
          }
          vbox.appendChild(card);
        });
      })
      .catch(function () {});

    // ---- Firebase (likes and comments) ----
    var db = null;
    var fs = null;
    try {
      var appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      var app = appMod.initializeApp(window.firebaseConfig);
      db = fs.getFirestore(app);
    } catch (e) {
      db = null;
    }

    function makeId(src) {
      return String(src).replace(/[^a-zA-Z0-9]/g, '_').slice(-100);
    }

    function addSocial(fig, src) {
      var id = makeId(src);
      var box = document.createElement('div');
      box.className = 'social';

      var bar = document.createElement('div');
      bar.className = 'social-bar';
      var likeBtn = document.createElement('button');
      var commentBtn = document.createElement('button');
      commentBtn.textContent = 'Comments';
      bar.appendChild(likeBtn);
      bar.appendChild(commentBtn);
      box.appendChild(bar);

      var count = 0;
      var liked = false;
      var likedKey = 'liked_' + id;
      try { liked = localStorage.getItem(likedKey) === '1'; } catch (e) {}
      var photoRef = fs.doc(db, 'photos', id);

      function renderLike() {
        likeBtn.textContent = (liked ? '\u2665 ' : '\u2661 ') + count;
        likeBtn.className = liked ? 'liked' : '';
      }
      renderLike();

      fs.getDoc(photoRef).then(function (snap) {
        count = snap.exists() ? (snap.data().likes || 0) : 0;
        renderLike();
      }).catch(function () {});

      likeBtn.addEventListener('click', function () {
        if (liked) return;
        liked = true;
        count += 1;
        renderLike();
        try { localStorage.setItem(likedKey, '1'); } catch (e) {}
        fs.setDoc(photoRef, { likes: fs.increment(1) }, { merge: true }).catch(function () {
          liked = false;
          count -= 1;
          renderLike();
          try { localStorage.removeItem(likedKey); } catch (e) {}
        });
      });

      var cbox = document.createElement('div');
      cbox.className = 'comments-box';
      var list = document.createElement('div');
      list.className = 'comment-list';
      var form = document.createElement('form');
      form.className = 'comment-form';
      var nameInput = document.createElement('input');
      nameInput.placeholder = 'Your name';
      nameInput.maxLength = 40;
      var textInput = document.createElement('textarea');
      textInput.placeholder = 'Write a comment...';
      textInput.rows = 2;
      textInput.maxLength = 500;
      var sendBtn = document.createElement('button');
      sendBtn.type = 'submit';
      sendBtn.textContent = 'Send';
      form.appendChild(nameInput);
      form.appendChild(textInput);
      form.appendChild(sendBtn);
      cbox.appendChild(list);
      cbox.appendChild(form);
      box.appendChild(cbox);

      function loadComments() {
        var q = fs.query(fs.collection(db, 'photos', id, 'comments'), fs.orderBy('createdAt', 'asc'));
        fs.getDocs(q).then(function (snap) {
          list.textContent = '';
          snap.forEach(function (d) {
            var c = d.data();
            var row = document.createElement('div');
            row.className = 'comment';
            var who = document.createElement('b');
            who.textContent = c.name || '';
            var msg = document.createElement('span');
            msg.textContent = c.text || '';
            row.appendChild(who);
            row.appendChild(msg);
            list.appendChild(row);
          });
          if (!snap.size) list.textContent = 'No comments yet.';
        }).catch(function () {
          list.textContent = 'Could not load comments.';
        });
      }

      var loaded = false;
      commentBtn.addEventListener('click', function () {
        cbox.classList.toggle('open');
        if (!loaded) { loaded = true; loadComments(); }
      });

      var lastSent = 0;
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var n = nameInput.value.trim();
        var t = textInput.value.trim();
        if (!n || !t) return;
        if (Date.now() - lastSent < 10000) return;
        lastSent = Date.now();
        sendBtn.disabled = true;
        fs.addDoc(fs.collection(db, 'photos', id, 'comments'), {
          name: n.slice(0, 40),
          text: t.slice(0, 500),
          createdAt: fs.serverTimestamp()
        }).then(function () {
          textInput.value = '';
          loadComments();
        }).catch(function () {}).then(function () {
          sendBtn.disabled = false;
        });
      });

      fig.appendChild(box);
    }

    // ---- Photo gallery ----
    fetch('data/photos.json?v=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var gallery = document.getElementById('gallery');
        (data.items || []).forEach(function (item) {
          if (!item.image) return;
          var fig = document.createElement('figure');
          fig.className = 'photo-card';
          var img = document.createElement('img');
          img.src = item.image;
          img.alt = item.title || 'Photo';
          fig.appendChild(img);
          if (item.title) {
            var cap = document.createElement('figcaption');
            cap.textContent = item.title;
            fig.appendChild(cap);
          }
          if (db) addSocial(fig, item.image);
          gallery.appendChild(fig);
        });
      })
      .catch(function () {});
  </script>
</body>
</html>
