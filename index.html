<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REZAUL KARIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', Arial, sans-serif;
      background: url('sahed.jpg') center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 70px;
    }
    .content {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 54px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
    }
    h2 {
      margin: 0 0 25px;
      font-size: 22px;
      font-weight: 600;
      color: #7dd3fc;
    }
    p {
      margin: 0 auto;
      max-width: 650px;
      font-size: 18px;
      line-height: 1.7;
      color: #e2e8f0;
    }
    .photo-card {
      width: 100%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 12px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .photo-card img {
      display: block;
      width: 100%;
      border-radius: 12px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .gallery .photo-card {
      margin: 0;
      max-width: none;
    }
    .gallery figcaption {
      margin-top: 10px;
      font-size: 15px;
      color: #222;
    }
    .gallery figure {
      margin: 0;
    }
    .admin-link {
      position: fixed;
      right: 14px;
      bottom: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
    }
    .admin-link:hover {
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>REZAUL KARIM</h1>
    <h2>Digital Marketing Learner</h2>
    <p>I am learning digital marketing and I want to work as a freelancer.</p>
    <div class="photo-card">
      <img src="photo2.jpeg" alt="REZAUL KARIM">
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <a class="admin-link" href="/admin/">Admin</a>

  <script>
    fetch('data/photos.json?v=' + Date.now())
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var box = document.getElementById('gallery');
        (data.items || []).forEach(function (item) {
          if (!item.image) return;
          var fig = document.createElement('figure');
          fig.className = 'photo-card';
          var img = document.createElement('img');
          img.src = item.image;
          img.alt = item.title || 'Photo';
          fig.appendChild(img);
          if (item.title) {
            var cap = document.createElement('figcaption');
            cap.textContent = item.title;
            fig.appendChild(cap);
          }
          box.appendChild(fig);
        });
      })
      .catch(function () {});
  </script>
</body>
</html>
