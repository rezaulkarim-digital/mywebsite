backend:
  name: github
  repo: rezaulkarim-digital/rezaulkarim-digital.github.io

media_folder: /uploads
public_folder: /uploads

collections:
  - name: site
    label: Website Info
    files:
      - name: info
        label: Name, Look, Contact and Videos
        file: data/site.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Main Photo, name: main_photo, widget: image }
          - { label: Background Photo, name: background, widget: image }
          - { label: Name Color, name: name_color, widget: color }
          - { label: Tagline Color, name: tagline_color, widget: color }
          - { label: Text Color, name: text_color, widget: color }
          - label: Font
            name: font
            widget: select
            options: [Poppins, Roboto, Lato, Montserrat, Playfair Display, Oswald]
            default: Poppins
          - { label: WhatsApp Number (with country code, e.g. 8801XXXXXXXXX), name: whatsapp, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Facebook Link, name: facebook, widget: string, required: false }
          - label: Videos
            name: videos
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: YouTube Link, name: url, widget: string }

  - name: gallery
    label: Photos
    files:
      - name: photos
        label: Photos
        file: data/photos.json
        format: json
        fields:
          - label: Photo list
            name: items
            widget: list
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Title, name: title, widget: string, required: false }
